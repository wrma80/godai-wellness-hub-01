name: Deploy via FTP (Locaweb)

on:
  push:
    branches:
      - main
    paths:
      - "html-version/**"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@master
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          local-dir: ./html-version/
          server-dir: /public_html/
          # Preserve runtime state on the server (created/edited via admin panel).
          # These paths are relative to local-dir (./html-version/).
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            data/admin.json
            data/admin-logs.json
            data/content.json
            data/ctas.json
            data/faq.json
            data/gallery.json
            data/messages.json
            data/navigation.json
            data/password-resets.json
            data/seo.json
            data/settings.json
            data/site-images.json
            data/testimonials.json
            assets/uploads/site-images/**
            assets/uploads/backups/**
            includes/email-config.php
